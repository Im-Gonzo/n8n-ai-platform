apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-demo-workflows
  namespace: n8n
data:
  "workflow-demo.json": |
    {
      "name": "AI Demo Workflow",
      "active": false,
      "nodes": [
        {
          "parameters": {},
          "id": "74003dcd-2ac7-4caa-a1cd-adecc5143c07",
          "name": "Chat Trigger",
          "type": "@n8n/n8n-nodes-langchain.chatTrigger",
          "typeVersion": 1,
          "position": [
            660,
            340
          ]
        },
        {
          "parameters": {},
          "id": "ce8c3da4-899c-4cc4-af73-8096c64eec64",
          "name": "Basic LLM Chain",
          "type": "@n8n/n8n-nodes-langchain.chainLlm",
          "typeVersion": 1.3,
          "position": [
            880,
            340
          ]
        },
        {
          "parameters": {
            "model": "llama3.2:latest",
            "options": {}
          },
          "id": "3dee878b-d748-4829-ac0a-cfd6705d31e5",
          "name": "Ollama Chat Model",
          "type": "@n8n/n8n-nodes-langchain.lmChatOllama",
          "typeVersion": 1,
          "position": [
            900,
            560
          ]
        }
      ],
      "connections": {
        "Chat Trigger": {
          "main": [
            [
              {
                "node": "Basic LLM Chain",
                "type": "main",
                "index": 0
              }
            ]
          ]
        },
        "Ollama Chat Model": {
          "ai_languageModel": [
            [
              {
                "node": "Basic LLM Chain",
                "type": "ai_languageModel",
                "index": 0
              }
            ]
          ]
        }
      },
      "settings": {
        "executionOrder": "v1"
      }
    }
  "ollama-credentials.json": |
    [
      {
        "name": "Local Ollama service",
        "type": "ollamaApi",
        "data": {
          "host": "ollama.n8n.svc.cluster.local",
          "port": "11434"
        }
      }
    ]