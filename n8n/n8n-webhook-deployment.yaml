apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    service: n8n-webhook
  name: n8n-webhook
  namespace: n8n
spec:
  replicas: 2  # Adjust based on your webhook load
  selector:
    matchLabels:
      service: n8n-webhook
  template:
    metadata:
      labels:
        service: n8n-webhook
    spec:
      containers:
        - command:
            - /bin/sh
          args:
            - -c
            - sleep 5; n8n webhook
          env:
            - name: DB_TYPE
              value: postgresdb
            - name: DB_POSTGRESDB_HOST
              value: postgres-service.n8n.svc.cluster.local
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              value: n8n
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_NON_ROOT_USER
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_NON_ROOT_PASSWORD
            # Queue Mode Settings
            - name: EXECUTIONS_MODE
              value: "queue"
            - name: QUEUE_BULL_REDIS_HOST
              value: "redis.n8n.svc.cluster.local"
            - name: QUEUE_BULL_REDIS_PORT
              value: "6379"
            # Set the webhook URL to match your ingress
            - name: WEBHOOK_URL
              value: "http://n8n.local"
            # Get the same encryption key as the main instance
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: N8N_ENCRYPTION_KEY
                  optional: true
          image: n8nio/n8n
          name: n8n-webhook
          ports:
            - containerPort: 5678
          resources:
            requests:
              cpu: "0.2"
              memory: "250Mi"
            limits:
              cpu: "0.5"
              memory: "640Mi"
      restartPolicy: Always
      volumes:
        - name: postgres-secret
          secret:
            secretName: postgres-secret
        - name: n8n-secret
          secret:
            secretName: n8n-secret
          optional: true
